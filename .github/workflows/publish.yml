name: Publish image

on:
  schedule:
    # 4:00 AM America/Los_Angeles during daylight saving time.
    - cron: "0 11 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      openclaw_base_image:
        description: "OpenClaw image to use as the runtime"
        required: false
        default: "ghcr.io/openclaw/openclaw:latest"
        type: string
      image_tag:
        description: "Optional additional shipyard image tag (for example, 2026.7.1)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
            type=raw,value=${{ inputs.image_tag || 'manual' }},enable=${{ inputs.image_tag != '' }}
            type=sha,prefix=

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Always check ghcr.io/openclaw/openclaw:latest on scheduled rebuilds.
          pull: true
          build-args: |
            OPENCLAW_BASE_IMAGE=${{ inputs.openclaw_base_image || 'ghcr.io/openclaw/openclaw:latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
